name: Build mod

# Runs on every push/PR, and can also be triggered manually from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This repo doesn't commit a Gradle wrapper, so we ask Gradle itself to be
      # installed/cached and invoke it directly (`gradle ...`) in later steps instead of
      # `./gradlew ...`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # GitHub's ubuntu-latest runners already ship an Android SDK (cmdline-tools) at
      # $ANDROID_SDK_ROOT, but not necessarily on PATH, and not necessarily with the
      # platform/build-tools versions this workflow pins below - this step makes sure both
      # exist, downloading them via sdkmanager if they aren't already present. Nothing here
      # is downloaded from third-party servers; it all comes from Google's own SDK repository.
      - name: Set up Android SDK components
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      # Builds the desktop jar, dexes it for Android with `d8`, and merges both into the
      # single cross-platform UnlimitedUnitCap.jar (see build.gradle for what each step does).
      - name: Build mod (desktop + Android)
        run: gradle deploy --no-daemon --stacktrace

      # The one to actually install in Mindustry, on either desktop or Android.
      - name: Upload cross-platform mod jar
        uses: actions/upload-artifact@v4
        with:
          name: UnlimitedUnitCap
          path: build/libs/UnlimitedUnitCap.jar
          if-no-files-found: error

      # Optional convenience artifact: the plain desktop-only jar, useful if you just want
      # to quickly test a change on desktop without waiting on the Android dexing step's
      # output specifically (it's built either way as part of `deploy`, so this is free).
      - name: Upload desktop-only mod jar
        uses: actions/upload-artifact@v4
        with:
          name: UnlimitedUnitCap-desktop-only
          path: build/libs/UnlimitedUnitCapDesktop.jar
          if-no-files-found: error
